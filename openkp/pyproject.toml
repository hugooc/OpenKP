[project]
name = "openkp"
version = "0.1.0"
description = "A patient-directed MCP server that bridges Claude and Kaiser Permanente's patient portal."
authors = [{name = "Hugo Campos"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}

dependencies = [
    # MCP server.
    #
    # Capped below 2.0. The 2.x line drops `mcp.server.fastmcp`, which
    # `mcp_server.py` imports at module level, so a fresh install that
    # resolves to 2.x cannot even import OpenKP. Caught when CI installed
    # mcp 2.0.0 on a clean machine and mypy failed to find the module.
    #
    # Lifting this cap means porting mcp_server.py to the 2.x API, not
    # just widening the range.
    "mcp[cli]>=1.2.0,<2.0.0",
    # HTTP client (async)
    "httpx>=0.27.0",
    # Browser automation for Ping OAuth login
    "playwright>=1.47.0",
    # Parsing HTML responses
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Credential management
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    # Data models
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://openkp.org"
Repository = "https://github.com/hugooc/OpenKP"
Issues = "https://github.com/hugooc/OpenKP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Linters are pinned to a major line on purpose. They were previously
    # unbounded, so CI installed whatever had shipped that morning while
    # local venvs kept an older version. Ruff 0.16.0 landed new rules and
    # turned every PR red with 87 findings in untouched files, on a repo
    # whose last commit had passed cleanly.
    #
    # A linter that changes under you is a broken build with no code change
    # behind it. Bump these deliberately, in their own PR, so the findings
    # arrive when someone has time to read them.
    "ruff>=0.15.0,<0.16.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
openkp = "openkp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openkp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
